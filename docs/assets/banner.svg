<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Document Intelligence Platform on Databricks banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>

  <!-- decorative document stack -->
  <g transform="translate(60,58)" opacity="0.95">
    <rect x="18" y="16" width="108" height="140" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <rect x="8" y="6" width="108" height="140" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="108" height="140" rx="10" fill="#f8fafc"/>
    <rect x="16" y="20" width="76" height="8" rx="4" fill="#94a3b8"/>
    <rect x="16" y="38" width="60" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="16" y="56" width="76" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="16" y="74" width="44" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="16" y="100" width="76" height="26" rx="6" fill="url(#accent)" opacity="0.85"/>
    <text x="24" y="118" font-family="Segoe UI, Verdana, sans-serif" font-size="11" font-weight="700" fill="#0f172a">AI PARSE</text>
  </g>

  <!-- flow arrow -->
  <g stroke="#f8fafc" stroke-width="3" opacity="0.7">
    <line x1="205" y1="128" x2="255" y2="128" marker-end="url(#arrowhead)"/>
  </g>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f8fafc"/>
    </marker>
  </defs>

  <!-- magnifier / search glyph -->
  <g transform="translate(260,90)" opacity="0.95">
    <circle cx="35" cy="35" r="30" fill="none" stroke="#38bdf8" stroke-width="7"/>
    <line x1="57" y1="57" x2="82" y2="82" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="35" cy="35" r="14" fill="#38bdf8" opacity="0.25"/>
  </g>

  <!-- sparkle / AI glyph -->
  <g transform="translate(370,70)" fill="url(#accent)">
    <path d="M40 0 L48 30 L78 38 L48 46 L40 76 L32 46 L2 38 L32 30 Z"/>
  </g>

  <!-- title block -->
  <g font-family="Segoe UI, Verdana, sans-serif" fill="#f8fafc">
    <text x="470" y="108" font-size="42" font-weight="800">Document Intelligence Platform</text>
    <text x="470" y="146" font-size="24" font-weight="600" fill="#c7d2fe">on Databricks</text>
    <text x="470" y="182" font-size="16" fill="#cbd5e1">Ingest &#8226; Parse &#8226; Classify &#8226; Extract &#8226; Index &#8226; Search / RAG &#8226; Monitor</text>
  </g>

  <!-- bottom accent bar -->
  <rect x="0" y="252" width="1200" height="8" fill="url(#accent)"/>
</svg>
