[project]
name = "document-intelligence-platform"
version = "0.1.0"
description = "Databricks document intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "databricks-connect>=15.4",
  "databricks-sdk>=0.30",
  "databricks-vectorsearch>=0.40",
  "databricks-agents>=0.10",
  "mlflow>=2.16",
  "pyspark>=3.5",
  "pandas>=2.2",
  "pytest>=8.0",
  "streamlit>=1.38",
  "databricks-sql-connector>=3.4",
  "plotly>=5.22",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false
